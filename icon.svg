<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Fondo oscuro abisal consistente con la app -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1526" />
      <stop offset="100%" stop-color="#070b14" />
    </linearGradient>
    <!-- Brillo cian para el cubo de inventario -->
    <linearGradient id="cubeStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <!-- Acento dorado para el check de verificación -->
    <linearGradient id="goldBadge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <!-- Lienzo completo (seguro para íconos maskable en Android) -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="28" y="28" width="456" height="456" rx="92" fill="none" stroke="#1e293b" stroke-width="6" />

  <!-- Halo sutil detrás del cubo -->
  <circle cx="256" cy="248" r="142" fill="#06b6d4" fill-opacity="0.10" />

  <!-- Cubo de almacén centrado dentro de la zona segura (70%) -->
  <g transform="translate(116, 108) scale(11.6)" fill="none" stroke="url(#cubeStroke)" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z" fill="#06b6d4" fill-opacity="0.12" />
    <path d="m3.3 7 8.7 5 8.7-5" />
    <path d="M12 22V12" />
  </g>

  <!-- Insignia dorada de check verificado -->
  <circle cx="352" cy="346" r="54" fill="#070b14" />
  <circle cx="352" cy="346" r="44" fill="url(#goldBadge)" />
  <path d="M332 346 L346 360 L374 331" fill="none" stroke="#070b14" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
</svg>
